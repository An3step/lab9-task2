name: Multiplatform Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Android App
        run: ./gradlew :app:assembleDebug
      - name: Unit Tests for Android
        run: |
          echo "Running unit tests for Android"
          sleep 180
      - name: Integration Tests for Android
        run: |
          echo "Running integration tests for Android"
          sleep 180
      - name: UI Tests for Android
        run: |
          echo "Running UI tests for Android"
          sleep 180
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: app/build/outputs/apk/debug/
          retention-days: 7

  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Build Desktop (Windows)
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon
      - name: Unit Tests for Desktop
        shell: cmd
        run: |
          echo "Running unit tests for Desktop"
          powershell -Command "Start-Sleep -Seconds 180"
      - name: Integration Tests for Desktop
        shell: cmd
        run: |
          echo "Running integration tests for Desktop"
          powershell -Command "Start-Sleep -Seconds 180"
      - name: UI Tests for Desktop
        shell: cmd
        run: |
          echo "Running UI tests for Desktop"
          powershell -Command "Start-Sleep -Seconds 180"
      - name: Upload Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build
          path: composeApp/build/compose/binaries/main/
          retention-days: 7

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Wasm
        run: ./gradlew :composeApp:wasmJsBrowserDistribution
      - name: Unit Tests for Wasm
        run: |
          echo "Running unit tests for WebAssembly"
          sleep 180
      - name: Integration Tests for Wasm
        run: |
          echo "Running integration tests for WebAssembly"
          sleep 180
      - name: UI Tests for Wasm
        run: |
          echo "Running UI tests for WebAssembly"
          sleep 180
      - name: Upload Wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 7

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build iOS Framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Unit Tests for iOS
        run: |
          echo "Running unit tests for iOS"
          sleep 180
      - name: Integration Tests for iOS
        run: |
          echo "Running integration tests for iOS"
          sleep 180
      - name: UI Tests for iOS
        run: |
          echo "Running UI tests for iOS"
          sleep 180
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: composeApp/build/xcode-frameworks/
          retention-days: 7
